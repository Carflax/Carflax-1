<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />

  <!-- Open Graph / WhatsApp Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Festival dos Instaladores — Carflax" />
  <meta property="og:description"
    content="Festival dos Instaladores Carflax: Conectando marcas, instaladores e oportunidades de negócio." />
  <meta property="og:image" content="/FESTIVAL.png" />
  <meta property="og:image:secure_url" content="/FESTIVAL.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />


  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Festival dos Instaladores — Carflax" />
  <meta name="twitter:description"
    content="Festival dos Instaladores Carflax: Conectando marcas, instaladores e oportunidades de negócio." />
  <meta name="twitter:image" content="/FESTIVAL.png" />

  <!-- PWA / ícone / viewport — escritos por script para servir DOIS apps
       instaláveis: o HUB e o Gestor (/gestor). Só a tag certa chega a existir:
       trocar o link depois de criado não basta, porque o iPhone já leu o
       manifest do HUB (start_url "/") e o Gestor instalado abria no HUB.
       No Gestor também trava o zoom: o iPhone dava zoom ao tocar num campo. -->
  <script>
    (function () {
      var gestor = location.pathname.indexOf('/gestor') === 0;
      var c = gestor
        ? { manifest: '/gestor.webmanifest', icon: '/gestor/icon-192.png', apple: '/gestor/apple-touch-icon.png',
            nome: 'Carflax Gestor', appleTitulo: 'Gestor', tema: '#020617', titulo: 'Carflax Gestor',
            viewport: 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover' }
        : { manifest: '/manifest.webmanifest', icon: '/favicon.png', apple: '/favicon.png',
            nome: 'Carflax Hub', appleTitulo: 'Carflax', tema: '#0f172a', titulo: 'Carflax | Tudo em um só lugar',
            viewport: 'width=device-width, initial-scale=1.0, viewport-fit=cover' };
      document.write(
        '<meta name="viewport" content="' + c.viewport + '" />' +
        '<link rel="icon" type="image/png" href="' + c.icon + '" />' +
        '<link rel="shortcut icon" href="' + c.icon + '" />' +
        '<link rel="manifest" href="' + c.manifest + '" />' +
        '<meta name="theme-color" content="' + c.tema + '" />' +
        '<meta name="application-name" content="' + c.nome + '" />' +
        '<meta name="apple-mobile-web-app-title" content="' + c.appleTitulo + '" />' +
        '<link rel="apple-touch-icon" href="' + c.apple + '" />' +
        '<title>' + c.titulo + '</title>'
      );
    })();
  </script>
  <meta name="color-scheme" content="dark light" />

  <!-- iOS / Safari standalone -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>



<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
