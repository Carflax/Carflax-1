<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Open Graph / WhatsApp Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Festival dos Instaladores — Carflax" />
  <meta property="og:description"
    content="Festival dos Instaladores Carflax: Conectando marcas, instaladores e oportunidades de negócio." />
  <meta property="og:image" content="/FESTIVAL.png" />
  <meta property="og:image:secure_url" content="/FESTIVAL.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />


  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Festival dos Instaladores — Carflax" />
  <meta name="twitter:description"
    content="Festival dos Instaladores Carflax: Conectando marcas, instaladores e oportunidades de negócio." />
  <meta name="twitter:image" content="/FESTIVAL.png" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="color-scheme" content="dark light" />
  <meta name="application-name" content="Carflax Hub" />

  <!-- iOS / Safari standalone -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Carflax" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <title>Carflax | Tudo em um só lugar</title>

  <!-- Gestor (/gestor) é um app instalável à parte: troca manifest, nome e ícone
       antes do navegador ler, para "Adicionar à tela inicial" instalar o Gestor
       (abre direto nele, com ícone próprio) e não o HUB inteiro. -->
  <script>
    (function () {
      if (location.pathname.indexOf('/gestor') !== 0) return;
      var set = function (sel, attr, val) { var el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
      set('link[rel="manifest"]', 'href', '/gestor.webmanifest');
      set('link[rel="apple-touch-icon"]', 'href', '/gestor/apple-touch-icon.png');
      set('link[rel="icon"]', 'href', '/gestor/icon-192.png');
      set('meta[name="apple-mobile-web-app-title"]', 'content', 'Gestor');
      set('meta[name="application-name"]', 'content', 'Carflax Gestor');
      set('meta[name="theme-color"]', 'content', '#020617');
      document.title = 'Carflax Gestor';
    })();
  </script>
</head>



<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
