<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --azul: #1e63c8;
      --azul-escuro: #172554;
      --bg: #ffffff;
      --linha: #e6e9ef;
      --texto: #14181f;
      --muted: #6b7280;
      --hover: #f2f6fc;
      --verde: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--texto);
    }
    header {
      background: #ffffff;
      padding: 10px 12px 8px;
      display: flex;
      justify-content: center;
      border-bottom: 1px solid var(--linha);
    }
    header img.brand { height: 42px; width: auto; display: block; }

    /* === TABS === */
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--linha);
      background: #fff;
    }
    .tabs button {
      flex: 1;
      padding: 9px 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .tabs button:hover { color: var(--azul); }
    .tabs button.active {
      color: var(--azul);
      border-bottom-color: var(--azul);
    }
    .tabs button svg { width: 14px; height: 14px; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* === RAMAIS === */
    .subbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 14px; background: #fff; border-bottom: 1px solid var(--linha);
    }
    .subbar .titulo {
      font-size: 12px; font-weight: 800; letter-spacing: .14em;
      text-transform: uppercase; color: var(--azul-escuro);
    }
    .subbar .count { font-size: 10px; font-weight: 700; color: var(--muted); }
    .search { padding: 8px; border-bottom: 1px solid var(--linha); }
    .search input {
      width: 100%; padding: 8px 10px; border: 1px solid var(--linha); border-radius: 8px;
      font-size: 13px; background: #fff; color: var(--texto); outline: none;
    }
    .search input:focus { border-color: var(--azul); }
    #list { max-height: 400px; overflow-y: auto; background: #fff; }
    .row {
      display: flex; align-items: center; gap: 10px; padding: 6px 14px;
      border-bottom: 1px solid var(--linha); cursor: pointer;
    }
    .row:hover { background: var(--hover); }
    .row .ramal {
      font-variant-numeric: tabular-nums; font-weight: 800; color: var(--azul);
      min-width: 42px; font-size: 13px;
    }
    .row .nome { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .01em; }
    .empty, .err { padding: 24px 12px; text-align: center; color: var(--muted); font-size: 12px; }
    .err { color: #dc2626; }

    /* === ENTREGAS === */
    .entregas-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      border: 1px solid var(--linha);
      margin: 8px;
      border-radius: 8px;
      overflow: hidden;
    }
    .dia-col { border-right: 1px solid var(--linha); }
    .dia-col:last-child { border-right: none; }
    .dia-header {
      padding: 7px 4px;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      text-align: center;
      background: var(--azul);
      color: #fff;
    }
    .dia-city {
      padding: 5px 4px;
      font-size: 10px;
      font-weight: 600;
      text-align: center;
      border-bottom: 1px solid var(--linha);
      color: var(--texto);
    }
    .dia-city:last-child { border-bottom: none; }
    .dia-city.destaque {
      color: var(--azul);
      font-weight: 800;
    }
    .hoje-indicator {
      padding: 8px 12px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--verde);
      background: #f0fdf4;
      border-bottom: 1px solid #bbf7d0;
    }
    .hoje-indicator svg { vertical-align: -2px; margin-right: 4px; width: 14px; height: 14px; }

    /* === FRETES === */
    .fretes-search { padding: 8px; border-bottom: 1px solid var(--linha); }
    .fretes-search input {
      width: 100%; padding: 8px 10px; border: 1px solid var(--linha); border-radius: 8px;
      font-size: 13px; background: #fff; color: var(--texto); outline: none;
    }
    .fretes-search input:focus { border-color: var(--azul); }
    .fretes-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .fretes-table thead th {
      padding: 8px 10px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #fff;
      background: var(--azul-escuro);
      text-align: left;
      position: sticky;
      top: 0;
    }
    .fretes-table thead th:not(:first-child) { text-align: right; }
    .fretes-table tbody td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--linha);
      font-weight: 600;
    }
    .fretes-table tbody td:first-child {
      font-weight: 700;
      color: var(--azul-escuro);
    }
    .fretes-table tbody td:not(:first-child) {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--texto);
    }
    .fretes-table tbody tr:hover { background: var(--hover); }
    #fretes-container { max-height: 440px; overflow-y: auto; }

    /* === TOAST / FOOTER === */
    #toast {
      position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
      background: var(--azul-escuro); color: #fff; font-size: 11px; font-weight: 700;
      padding: 6px 12px; border-radius: 999px; opacity: 0; transition: opacity .2s;
      pointer-events: none; z-index: 10;
    }
    #toast.show { opacity: 1; }
    footer {
      padding: 6px 12px; font-size: 9px; color: var(--muted);
      text-align: center; border-top: 1px solid var(--linha); background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <img class="brand" src="logo.png" alt="Carflax" />
  </header>

  <div class="tabs">
    <button class="active" data-tab="ramais">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      Ramais
    </button>
    <button data-tab="entregas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      Entregas
    </button>
    <button data-tab="fretes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Fretes
    </button>
  </div>

  <!-- TAB: RAMAIS -->
  <div class="tab-content active" id="tab-ramais">
    <div class="subbar">
      <span class="titulo">Ramais</span>
      <span class="count" id="count"></span>
    </div>
    <div class="search">
      <input id="q" type="text" placeholder="Buscar por nome ou ramal..." autocomplete="off" />
    </div>
    <div id="list"><div class="empty">Carregando...</div></div>
    <footer>Clique num ramal para copiar</footer>
  </div>

  <!-- TAB: ENTREGAS -->
  <div class="tab-content" id="tab-entregas">
    <div id="hoje-bar"></div>
    <div class="entregas-grid" id="entregas-grid"></div>
    <footer>Cidades atendidas por dia da semana</footer>
  </div>

  <!-- TAB: FRETES -->
  <div class="tab-content" id="tab-fretes">
    <div class="fretes-search">
      <input id="qf" type="text" placeholder="Buscar cidade..." autocomplete="off" />
    </div>
    <div id="fretes-container"></div>
    <footer>Valores de frete e pedido minimo por cidade</footer>
  </div>

  <div id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
